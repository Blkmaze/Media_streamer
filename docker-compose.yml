version: '3.8'

services:
  media-streamer:
    build: .
    container_name: media-streamer
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./media:/app/media
      - media-uploads:/app/media/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/media', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  media-uploads:
    driver: local
