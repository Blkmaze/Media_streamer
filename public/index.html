<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Streamer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Media Streamer</h1>
            <p>Stream your video and audio files</p>
        </header>

        <div class="upload-section">
            <h2>Upload Media</h2>
            <form id="uploadForm">
                <input type="file" id="fileInput" accept="video/*,audio/*" required>
                <button type="submit">Upload</button>
            </form>
            <div id="uploadProgress" class="hidden">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <p id="progressText">Uploading...</p>
            </div>
        </div>

        <div class="player-section">
            <h2>Now Playing</h2>
            <div id="playerContainer" class="player-container">
                <p class="placeholder">Select a file from the library to start playing</p>
            </div>
            <div id="playerControls" class="player-info hidden">
                <h3 id="currentFileName"></h3>
                <p id="currentFileInfo"></p>
            </div>
        </div>

        <div class="library-section">
            <div class="library-header">
                <h2>Media Library</h2>
                <button id="refreshBtn" class="btn-secondary">Refresh</button>
            </div>
            <div id="filterButtons" class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="video">Videos</button>
                <button class="filter-btn" data-filter="audio">Audio</button>
            </div>
            <div id="libraryContainer" class="library-container">
                <p class="loading">Loading library...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
